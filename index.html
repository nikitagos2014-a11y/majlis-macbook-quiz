:root{--ink:#04050B;--blue:#1E3BFF;--white:#FFFFFF;--on-white:#0B0D18;--panel:#F4F5F8;--line:rgba(4,5,11,.12);--muted:rgba(11,13,24,.62);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--white);color:var(--on-white);font:400 16px/1.45 Onest,system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--white)}
.top-in{max-width:560px;margin:0 auto;padding:12px 20px 0}
.row{display:flex;align-items:center;justify-content:space-between;height:40px}
.logo{display:block;height:24px}.logo img{height:100%;width:auto;display:block}
.step{font:500 13px/1.3 Onest,sans-serif;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line);margin-top:10px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:3px;transition:width .3s var(--ease)}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 20px calc(24px + env(safe-area-inset-bottom));flex:1;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
h1{font:500 clamp(30px,8.5vw,42px)/.98 Unbounded,sans-serif;letter-spacing:-.045em;color:var(--ink)}
h2{font:500 clamp(23px,6.2vw,30px)/1.06 Unbounded,sans-serif;letter-spacing:-.04em;color:var(--ink);margin-top:14px}
h2:focus{outline:none}
h1,h2,.name{text-wrap:balance}
/* Первый экран: типографика блоком на всю ширину, MacBook открывает крышку. Геометрия снимка: крышка 9.11% слева и справа, шарнир 92.97% высоты */
.poster{margin-top:12px;display:block;font:500 72px/.94 Unbounded,sans-serif;letter-spacing:-.05em;color:var(--ink)}
.ln{display:block;overflow:hidden;white-space:nowrap;line-height:.84;padding:.14em 0 .2em;margin:-.14em 0 -.13em}
.fit{display:inline-block;letter-spacing:-.05em;opacity:0;transform:translateY(165%)}
.acc{color:var(--blue)}
.ready .fit{opacity:1;transform:none;transition:transform .72s var(--ease),opacity .24s ease-out}
.ready .ln:nth-child(2) .fit{transition-delay:70ms}.ready .ln:nth-child(3) .fit{transition-delay:140ms}
.mac{position:relative;aspect-ratio:1400/839;margin:18px -14px 0;perspective:3400px;perspective-origin:50% 93%}
.mac img{position:absolute;display:block;max-width:none;height:auto}
.lid{position:absolute;left:9.11%;right:9.11%;top:0;height:92.97%;overflow:hidden;transform-origin:50% 100%;border-radius:6px 6px 0 0;transform:rotateX(-88deg);backface-visibility:hidden;will-change:transform}
.lid img{left:-11.14%;top:0;width:122.28%}
.base{position:absolute;left:0;right:0;bottom:0;height:7.03%;overflow:hidden}
.base img{left:0;bottom:0;width:100%}
.wake{position:absolute;left:1.8%;right:1.8%;top:3.2%;bottom:4.5%;background:#000;opacity:1}
.ready .lid{transform:none;animation:lid .95s cubic-bezier(.2,.8,.2,1) .18s both}
.ready .wake{opacity:0;animation:wake .6s ease-out .72s both}
@keyframes lid{from{transform:rotateX(-88deg)}to{transform:none}}
@keyframes wake{from{opacity:1}to{opacity:0}}
.tick{margin:18px -20px 0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);opacity:0}
.ready .tick{opacity:1;transition:opacity .5s ease-out 1s}
.tick-in{display:flex;width:max-content;animation:tick 24s linear infinite}
.tick-in span{font:500 17px/1.2 Unbounded,sans-serif;letter-spacing:-.03em;color:var(--muted);padding:0 15px;white-space:nowrap}
@keyframes tick{to{transform:translateX(-50%)}}
.go{display:flex;flex-direction:column;gap:12px;margin-top:auto;padding-top:20px}.note-s{color:var(--muted);font-size:13px;line-height:1.4;text-align:center}
#go{gap:10px}.arr{width:20px;height:20px;transition:transform .16s var(--ease)}
#go:hover .arr{transform:translateX(4px)}
.ready #go .arr{animation:nudge .6s var(--ease) 1.5s 2 alternate}
@keyframes nudge{to{transform:translateX(5px)}}
body:has(#start.on) .bar{visibility:hidden}
#start{width:100%;max-width:400px;margin-inline:auto}
@media (max-height:700px){.tick{display:none}.mac{margin:10px 26px 0}.go{padding-top:12px}}
@media (max-height:600px){.mac{margin:6px 44px 0}.poster{margin-top:4px}}

/* Итог: товар на чистом поле, потом название, цена, таблица; второй вариант компактной строкой, кнопка всегда под рукой */
#edit{display:none;font-size:14px}
body:has(#result.on) #edit{display:block}
body:has(#result.on) .bar,body:has(#finding.on) .step{display:none}
#result{margin-bottom:calc(-24px - env(safe-area-inset-bottom))}
#r-main{display:flex;flex-direction:column}
.band{position:relative;isolation:isolate;margin:10px 0 0;padding:16px;border-radius:20px;background:var(--panel);display:flex;flex-direction:column}
.band .tag{align-self:flex-start;max-width:100%;font:600 13px/1.3 Onest,sans-serif;color:var(--blue);animation:up .4s var(--ease) both}
.band .tag.warn{color:var(--on-white)}
.band .pic{display:flex;justify-content:center;align-items:center;margin:14px -4px 8px;height:clamp(190px,58vw,320px);animation:lift .6s var(--ease) both}
.band .pic{mix-blend-mode:multiply}.band .pic img{display:block;width:auto;height:100%;max-width:100%;object-fit:contain;transition:opacity .16s ease-out}
@keyframes lift{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.band .sw{display:flex;align-items:center;gap:12px;margin:0;flex-wrap:nowrap}
.band .sw button{min-width:0;padding:4px;display:block}
.band .sw i{width:22px;height:22px}
.sw-name{margin-left:4px;font-size:14px;font-weight:500;color:var(--muted)}
.info{display:flex;flex-direction:column;padding-top:20px}
.info .name{margin:0;font-size:clamp(26px,7.6vw,36px);line-height:1.02;animation:up .4s var(--ease) .04s both}
.info .price{margin-top:10px;font-size:clamp(34px,10vw,46px);animation:up .4s var(--ease) .08s both}
.info .price.ask{font-size:clamp(21px,5.6vw,26px)}
.info .note{margin-top:8px;animation:up .4s var(--ease) .12s both}
.rows{margin-top:18px;border-top:1px solid var(--line)}
.r{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.3}
.r dt{color:var(--muted)}.r dd{font-weight:600;text-align:right}
.info .eta{margin-top:0;padding:14px 0;background:none;border-radius:0;border-bottom:1px solid var(--line)}
.info details{margin-top:0;border-top:0;border-bottom:1px solid var(--line);padding:14px 0}
.info summary{font-size:15px}
.why-l{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.4;color:var(--on-white)}
.info .cfgs{margin-top:12px}
.site{align-self:flex-start;margin-top:16px}
.alt-row{display:flex;align-items:center;gap:12px;width:100%;margin-top:24px;padding:12px;text-align:left;background:var(--panel);border:0;border-radius:16px;cursor:pointer;transition:transform .16s var(--ease)}
.alt-row:active{transform:scale(.985)}
.alt-row{isolation:isolate}.alt-pic{flex:none;width:68px;height:44px;display:flex;align-items:center;justify-content:center;mix-blend-mode:multiply}
.alt-pic img{max-width:100%;max-height:100%}
.alt-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:13px;line-height:1.3;color:var(--muted)}
.alt-t small{font:600 12px/1.3 Onest,sans-serif;color:var(--blue)}
.alt-t b{font:600 15px/1.25 Onest,sans-serif;color:var(--on-white)}
.alt-p{flex:none;font:600 14px/1.2 Onest,sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
#result .foot{margin-top:0;padding:20px 0 16px}
.r-bar{position:sticky;bottom:0;z-index:4;margin:auto -20px 0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--white);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;animation:slideup .4s var(--ease) .1s both}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
#r-bar-price{flex:none;font:600 15px/1.2 Onest,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
#r-bar-price:empty{display:none}
.r-bar .btn{flex:1;min-height:50px;width:auto;padding:0 12px}
/* Качество: зоны нажатия от 44 px, видимый фокус, поясняющие строки */
:where(button,a,summary):focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.band .sw{gap:0;margin:-7px 0 -7px -7px}.band .sw button{padding:11px}
.sw-name{margin-left:2px}
#edit{min-height:44px;padding:0 0 0 12px}
.info summary{min-height:44px}.info details{padding:2px 0 2px}.info details[open]{padding-bottom:14px}
.why-l{margin-top:14px;gap:6px}.why-l li{position:relative;padding-left:16px;animation:up .4s var(--ease) .14s both}
.why-l li::before{content:"";position:absolute;left:0;top:.56em;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.eta-n{padding:10px 0 14px;font-size:13px;line-height:1.4;color:var(--muted);border-bottom:1px solid var(--line)}
.cfg{min-height:44px}.cfg em{display:inline-block;margin-left:8px;font:600 12px/1 Onest,sans-serif;font-style:normal;color:var(--blue)}
.alt-go{flex:none;width:18px;height:18px;color:var(--muted);margin-left:-4px}
.site{min-height:44px;display:inline-flex;align-items:center;margin-top:6px}
.foot a{color:var(--blue)}
/* Микроанимации */
.w{display:inline-block;white-space:pre;animation:up .38s var(--ease) both;animation-delay:calc(var(--i)*26ms)}
@keyframes up{from{opacity:0;transform:translateY(.45em)}to{opacity:1;transform:none}}
#opts>*{animation:rise .34s var(--ease) both;animation-delay:calc(var(--i,0)*34ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opt{position:relative}.opt span{flex:1;min-width:0}
.ck{flex:none;width:22px;height:22px;border-radius:50%;background:var(--blue);color:var(--white);display:flex;align-items:center;justify-content:center;transform:scale(0.6);opacity:0;transition:transform .2s var(--ease),opacity .12s}
.ck svg{width:14px;height:14px;stroke-width:3;color:var(--white)}
.opt.on .ck{transform:none;opacity:1}.opt.on .ck svg{color:var(--white)}
.pic img.swap{opacity:0}
.sw i{transition:transform .16s var(--ease)}.sw button:active i{transform:scale(.88)}.sw button.on i{transform:scale(1.04)}
.cfg{transition:border-color .16s,box-shadow .16s,transform .16s var(--ease)}.cfg:active{transform:scale(.985)}
.roll{display:inline-block;color:var(--blue)}
.lead{margin-top:10px;color:var(--muted);max-width:38ch;font-size:17px}
.hint{margin-top:8px;color:var(--muted);font-size:15px}
.back{align-self:flex-start;background:none;border:0;cursor:pointer;margin:12px 0 0 -8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--muted)}
.back svg{width:22px;height:22px}.back[hidden]{visibility:hidden;display:flex}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:60px;cursor:pointer;transition:border-color .16s,box-shadow .16s,transform .16s var(--ease)}
.opt:active{transform:scale(.985)}
.opt:hover,.opt:focus-visible{border-color:var(--blue);outline:none}
.opt.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.opt svg{flex:none;width:24px;height:24px;stroke-width:1.6;color:var(--on-white)}
.opt.on svg{color:var(--blue)}
.opt b{display:block;font:600 16px/1.3 Onest,sans-serif}
.opt small{display:block;font:400 14px/1.35 Onest,sans-serif;color:var(--muted);margin-top:2px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.dock{position:sticky;bottom:0;margin-top:auto;padding:16px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--white) 72%,rgba(255,255,255,0))}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 24px;border-radius:14px;background:var(--blue);color:var(--white);font:600 16px/1.1 Onest,sans-serif;text-decoration:none;border:0;cursor:pointer;width:100%;text-align:center;transition:transform .16s var(--ease),background .16s}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:var(--panel);color:var(--muted);cursor:default}
.btn.ghost{background:transparent;color:var(--on-white);border:1px solid var(--line)}
.skip{margin-top:6px}
.foot{margin-top:auto;padding-top:32px;color:var(--muted);font-size:13px;line-height:1.4}
.foot a{color:inherit}
.finding{flex:1;display:flex;align-items:center;min-height:60vh}
.finding p{font:500 clamp(24px,6.6vw,32px)/1.06 Unbounded,sans-serif;letter-spacing:-.04em;color:var(--ink)}
.r-head{margin-top:26px}
.r-head h2{margin:0}.r-head h2 span{display:block;color:var(--muted)}
.r-sub{margin-top:10px;color:var(--muted)}
.linkb{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font:inherit}
.cards{display:flex;flex-direction:column;gap:14px;margin:22px -8px 0;padding:8px;background:var(--panel);border-radius:22px}
.card{background:var(--white);border-radius:16px;padding:20px 18px 18px}
.tag{font:600 13px/1.3 Onest,sans-serif;color:var(--blue)}
.tag.warn{color:var(--on-white)}
.name{font:500 clamp(21px,5.8vw,26px)/1.05 Unbounded,sans-serif;letter-spacing:-.04em;color:var(--ink);margin-top:6px}
.spec{margin-top:8px;font-weight:500}
.price{margin-top:12px;font:500 clamp(26px,7.4vw,34px)/1 Unbounded,sans-serif;letter-spacing:-.045em;color:var(--blue);font-variant-numeric:tabular-nums}
.price.ask{font-size:clamp(19px,5.2vw,23px);line-height:1.1;letter-spacing:-.035em}
.note{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.4}
.eta{margin-top:14px;padding:12px 14px;background:var(--panel);border-radius:12px}.eta span{display:block;font-size:13px;color:var(--muted)}.eta b{display:block;font:600 16px/1.3 Onest,sans-serif;margin-top:2px;font-variant-numeric:tabular-nums}.eta small{display:block;font-size:13px;line-height:1.35;color:var(--muted);margin-top:4px}
.pic{display:flex;justify-content:center;margin:18px 0 6px}.pic img{display:block;width:auto;max-width:100%;height:auto;max-height:190px}
.cols{margin-top:6px}.cols>span{display:block;font-weight:600;font-size:14px}
.sw{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.sw button{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);min-width:52px}
.sw i{display:block;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(4,5,11,.14)}
.sw button.on{color:var(--on-white)}.sw button.on i{outline:2px solid var(--blue);outline-offset:2px}
.acts{display:flex;flex-direction:column;gap:12px;margin-top:18px;align-items:center}
.site{color:var(--blue);font-weight:500;font-size:15px;text-underline-offset:3px}
.why.flat{margin-top:0;padding-top:0;border:0}
.why{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.why>span{display:block;font-weight:600;font-size:14px}
.why ul{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.why li{position:relative;padding-left:16px;font-size:15px;line-height:1.4}
.why li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--blue)}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .16s}
