function renderResult() {
  const r = pick(answers), a = answers;
  $('r-title').innerHTML = r.alt ? 'Два варианта. <span>Под ваши задачи.</span>' : 'Ваш вариант. <span>Под ваши задачи.</span>';
  $('r-sub').textContent = r.budget === Infinity ? 'Бюджет не указан.' : `В бюджете до ${rub(r.budget)}.`;
  const box = $('cards'); box.innerHTML = '';
  box.appendChild(card(r.top, r.topTag, r.topWarn, a, r.n, true));
  if (r.alt) box.appendChild(card(r.alt, r.altTag, false, a, r.n, false));
  $('r-foot').textContent = 'Пошлина уже в цене, гарантия 12 месяцев. Менеджер один от запроса до получения. Кофе и зал: Иваново, Зверева, 8, 1 этаж, 107.';
  show('result');
}
$('go').onclick = () => { answers = {}; at = 0; render(); };
$('ok').onclick = next;
$('back').onclick = () => { if (at > 0) { at--; render(); } };
$('edit').onclick = () => { at = 0; render(); };
</script>
</body>
</html>
